name: CI & Security Audit

on:
  push:
    branches: [main, security-and-mcp-hardening]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Comprehensive Repository Secret Scanning
        run: |
          echo "Scanning codebase for exposed credential patterns..."
          PATTERNS='(ghp_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{22,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|sk-proj-[A-Za-z0-9_-]{40,}|sk-ant-api[A-Za-z0-9_-]{40,}|BEGIN (RSA|EC|OPENSSH|DSA|PGP)? PRIVATE KEY)'
          if git grep -iE "$PATTERNS" -- ':!tests' ':!src/server/secret-redaction.ts'; then
            echo "CRITICAL: Live credentials detected in repository!"
            exit 1
          fi
          echo "Secret scan passed cleanly."

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Full Test Suite (116 Tests across 17 Suites)
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Check for Working Tree Dirtiness
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working directory is dirty after build!"
            git status
            exit 1
          fi
