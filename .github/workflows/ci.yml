name: CI & Security Audit

on:
  push:
    branches: [main, security-and-mcp-hardening]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Test Suite (Unit & Security Tests)
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Check for Uncommitted Artifacts or Secrets
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working directory is dirty after build"
            git status
          fi
